[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-forecast"
version = "0.1.0"
description = "Availability-aware review-augmented search-interest forecasting"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
bert = ["torch>=2.2,<3", "transformers>=4.40,<5"]

[project.scripts]
sentiment-forecast = "sentiment_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
